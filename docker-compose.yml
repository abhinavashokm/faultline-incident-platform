# Faultline Incident Platform – Docker Compose
# Run everything:  docker compose up -d   (COMPOSE_PROFILES=backend,frontend set in .env)
# Just infra:      COMPOSE_PROFILES= docker compose up -d
# Backend only:    COMPOSE_PROFILES=backend docker compose up -d

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: faultline
      POSTGRES_PASSWORD: faultline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faultline"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging: *default-logging
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  # ── Migrations ──────────────────────────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: deploy/migrate/Dockerfile
    container_name: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CONTROL_PLANE_DATABASE_URL: postgresql+asyncpg://faultline:faultline@postgres:5432/control_plane
      PROCESSING_DATABASE_URL: postgresql+asyncpg://faultline:faultline@postgres:5432/processing
      # Required field – placeholder is fine for migrate-only container
      CONTROL_PLANE_INTERNAL_SERVICE_SECRET: placeholder-migrate-only
    restart: "no"
    profiles:
      - backend

  # ── Backend services ────────────────────────────────────────────────────────
  control-plane:
    build:
      context: .
      dockerfile: services/control-plane/Dockerfile
    container_name: control-plane
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount app source for hot-reload (--reload in CMD)
      - ./services/control-plane/app:/app/app
      # PEM keys – never baked into image
      - ./services/control-plane/keys:/app/keys:ro
    command: ["uvicorn", "app.api_main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - ./services/control-plane/.env
    environment:
      CONTROL_PLANE_DATABASE_URL: postgresql+asyncpg://faultline:faultline@postgres:5432/control_plane
      CONTROL_PLANE_SMTP_HOST: mailpit
      CONTROL_PLANE_SMTP_PORT: "1025"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *default-logging
    restart: unless-stopped
    profiles:
      - backend

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    container_name: ingestion
    ports:
      - "8001:8001"
    volumes:
      - ./services/ingestion/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    env_file:
      - ./services/ingestion/.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://redis:6379/0
      CONTROL_PLANE_INTERNAL_URL: http://control-plane:8000
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *default-logging
    restart: unless-stopped
    profiles:
      - backend

  processing-api:
    build:
      context: .
      dockerfile: services/processing/Dockerfile
    container_name: processing-api
    ports:
      - "8002:8002"
    volumes:
      - ./services/processing/app:/app/app
      - ./services/processing/keys:/app/keys:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8002", "--reload"]
    env_file:
      - ./services/processing/.env
    environment:
      PROCESSING_DATABASE_URL: postgresql+asyncpg://faultline:faultline@postgres:5432/processing
      PROCESSING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PROCESSING_AUTH_PROVIDER: jwks
      PROCESSING_AUTH_JWKS_URL: http://control-plane:8000/.well-known/jwks.json
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *default-logging
    restart: unless-stopped
    profiles:
      - backend

  processing-worker:
    build:
      context: .
      dockerfile: services/processing/Dockerfile
    container_name: processing-worker
    volumes:
      - ./services/processing/app:/app/app
      - ./services/processing/keys:/app/keys:ro
    command: ["python", "-m", "app.worker_main"]
    env_file:
      - ./services/processing/.env
    environment:
      ROLE: errors
      PROCESSING_DATABASE_URL: postgresql+asyncpg://faultline:faultline@postgres:5432/processing
      PROCESSING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PROCESSING_AUTH_PROVIDER: jwks
      PROCESSING_AUTH_JWKS_URL: http://control-plane:8000/.well-known/jwks.json
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped
    profiles:
      - backend

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
      target: dev
    container_name: frontend
    ports:
      - "3000:3000"
    volumes:
      # Full bind-mount for HMR
      - ./frontend-web:/app
      # Named volume so container node_modules are not shadowed by host bind-mount
      - frontend_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Required for Next.js HMR to detect file changes inside Docker on Linux
      WATCHPACK_POLLING: "true"
    depends_on:
      control-plane:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped
    profiles:
      - frontend

volumes:
  pgdata:
  frontend_node_modules:
